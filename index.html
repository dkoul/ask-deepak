<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#fafaf8" />
    <meta name="description" content="Deepak Koul — Senior Engineering Manager at Red Hat. Chat with Bubbly about his skills, experience, and how to connect." />
    <title>ask.deepak — Deepak Koul</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          document.documentElement.setAttribute('data-theme', t || 'light');
          if (t === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = t || 'light';
          if (localStorage.getItem('supportBannerHidden')) {
            document.documentElement.setAttribute('data-support-banner', 'hidden');
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', t === 'dark' ? '#0a0a0a' : '#fafaf8');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
